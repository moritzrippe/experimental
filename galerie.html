<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoma & Co.</title>
  <link rel="icon" type="image/png" href="fav.png">
  <meta name="theme-color" content="#194026">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    @font-face {
      font-family: 'head';
      src: url('fonts/head.otf') format('opentype');
    }

    :root {
      --green: #194026;
      --accent: #d0d8d1;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--accent);
      font-family: 'head', serif;
      color: var(--green);
      min-height: 100vh;
    }

    img {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    /* ================= HEADER ================= */

    header {
      background-color: var(--green);
      padding: 20px 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

 nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      line-height: 1;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      height: 100%;
    }

    .logo img {
      height: 15px;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      position: absolute;
      right: 32px;
    }

    nav a {
      margin-left: 32px;
      text-decoration: none;
      font-size: 15px;
      color: var(--white);
    }

    .social-icon img {
      width: 15px;
      height: auto;
      display: block;
    }

    .collection-heading {
    max-width: 1200px;
    margin: 40px auto 0 auto;
    padding: 0 32px;
    color: var(--green);
    font-size: 28px;
    }

    /* ================= BURGER ================= */

    .burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      position: absolute;
      right: 32px;
      z-index: 1100;
      background: none;
      border: none;
      padding: 0;
    }

    .burger span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: var(--accent);
    }

    /* ================= SIDE MENU ================= */

    .side-menu {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--green);
      z-index: 1050;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .side-menu.open {
      display: flex;
    }

    .side-menu a {
      text-decoration: none;
      font-size: 17px;
      color: var(--white);
      font-family: 'head', serif;
    }

    .side-menu a:hover {
      opacity: 0.7;
    }

    .side-menu-close {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      position: fixed;
      top: 2.5px;
      right: 32px;
      z-index: 1060;
      background: none;
      border: none;
      padding: 0;
      height: 35px;
    }

    .side-menu-close span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: var(--accent);
    }

    main {
      padding: 40px 32px 64px 32px;
    }

.gallery {
  max-width: 1200px;
  margin: 80px auto 0 auto;
  padding: 0 16px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);  
  gap: 16px;
  justify-content: center;
}

.gallery img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  pointer-events: auto;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.gallery img:hover {
  transform: scale(1.05);
}

    @media (max-width: 335px) {
      .logo img { height: 12px; }
      nav a { margin-left: 10px; font-size: 15px; }
      body {padding-top: 40px;}
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      body {padding-top: 40px;}
    }

    @media (max-width: 900px) {
      .nav-right { display: none; }
      .burger { display: flex; }
      .logo img { height: 14px; }
      nav a { margin-left: 17px; font-size: 15px; }
      body {padding-top: 40px;}
       .gallery {
    grid-template-columns: 1fr;
      margin: 10px auto 0 auto;
      padding: 0 0px;
  }
    }

    footer {
      margin-top: 120px;
      padding: 80px 24px;
      text-align: center;
      font-size: 10px;
      color: var(--green);
      border-top: none;
    }

  </style>
</head>

<body>

<header>
  <nav>
    <div class="logo">
      <img src="logo.png" alt="Logo" draggable="false">
    </div>

    <div class="nav-right">
      <a href="index.html" class="active">Kollektion</a>
      <a href="galerie.html">Galerie</a>
      <a href="https://www.instagram.com/thomaundco/" target="_blank" class="social-icon">
        <img src="social.png" alt="Instagram" draggable="false">
      </a>
    </div>

    <button class="burger" id="burgerBtn" aria-label="Menü öffnen">
      <span></span>
      <span></span>
    </button>
  </nav>
</header>

<div class="side-menu" id="sideMenu">
  <button class="side-menu-close" id="menuClose" aria-label="Menü schließen">
    <span></span>
    <span></span>
  </button>
  <a href="index.html">Kollektion</a>
  <a href="galerie.html">Galerie</a>
  <a href="https://www.instagram.com/thomaundco/" target="_blank">Instagram</a>
</div>

<main>
  <div class="gallery">
  <img src="images/g1.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
  <img src="images/g2.jpg" alt="">
</div>

</main>

<footer>
  Copyright © 2026 Mouleina. Alle Rechte vorbehalten.
</footer>

<script>
  const burgerBtn = document.getElementById('burgerBtn');
  const menuClose = document.getElementById('menuClose');
  const sideMenu = document.getElementById('sideMenu');

  burgerBtn.addEventListener('click', function () {
    sideMenu.classList.add('open');
  });

  menuClose.addEventListener('click', function () {
    sideMenu.classList.remove('open');
  });
</script>

</body>
</html>
