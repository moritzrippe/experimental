  <style>
    @font-face {
      font-family: 'head';
      src: url('../fonts/head.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --green: #194026;
      --accent: #f1f1d7;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #194026;
    }

    body {
      font-family: 'head', serif;
      background-color: #f1f1d7;
      color: var(--green);
      min-height: 100vh;
    }

    img {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    /* ================= HEADER ================= */

    header {
      background-color: var(--green);
      padding: 20px 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .logo img {
      height: 15px;
      display: block;
    }

        .nav-right {
      display: flex;
      align-items: center;
      position: absolute;
      right: 32px;
    }

    nav a {
      margin-left: 32px;
      text-decoration: none;
      font-size: 15px;
      color: var(--accent);
    }

    .social-icon img {
      width: 17px;
      height: auto;
      display: block;
    }

    /* ================= CAROUSEL ================= */

.carousel {
  margin-top: 0px;
  width: 100vw;
  overflow: hidden;
  position: relative;
  background: #f1f1d7;
}

.carousel-track {
  display: flex;
  width: 400%; /* Bleibt bei 400% für 4 Bilder */
  animation: slide 12s infinite;
}

.carousel-track img {
  width: 25%; /* WICHTIG: 1/4 der Track-Breite (400% / 4 = 100% Sichtfeld) */
  height: auto; 
  display: block;
  /* 'object-fit: contain' zeigt das ganze Bild, 'cover' würde zoomen. */
  object-fit: contain; 
}

@keyframes slide {
  0%   { transform: translateX(0); }       /* Bild 1 */
  20%  { transform: translateX(0); }

  25%  { transform: translateX(-25%); }    /* Bild 2 */
  45%  { transform: translateX(-25%); }

  50%  { transform: translateX(-50%); }    /* Bild 3 */
  70%  { transform: translateX(-50%); }

  75%  { transform: translateX(-75%); }    /* Bild 4 */
  95%  { transform: translateX(-75%); }

  100% { transform: translateX(0); }       /* Zurück zu Bild 1 */
}

    main {
      padding: 80px 32px 64px 32px;
    }

    /* ================= GRID ================= */

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .nav-right { display: none; }
      .burger { display: flex; }
      .logo img { height: 14px; }
      nav a { margin-left: 17px; font-size: 15px; }
      .carousel { height: 45vh; }
    }

    @media (max-width: 335px) {
      .logo img { height: 12px; }
      nav a { margin-left: 10px; font-size: 15px; }
    }

    /* ================= PRODUKTKARTE ================= */

    .product-card {
      text-decoration: none;
      color: var(--green);
      background-color: var(--white);
      padding: 20px;
      transition: transform 0.2s ease;
    }

    .product-card:hover { transform: translateY(-2px); }

    .product-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #ffffff;
      display: block;
    }

    .product-card .title {
      margin-top: 14px;
      font-size: 15px;
    }

    /* ================= FOOTER ================= */

    footer {
      margin-top: 120px;
      padding: 80px 24px;
      text-align: center;
      font-size: 10px;
      color: var(--green);
      border-top: none;
    }

  </style>
</head>
