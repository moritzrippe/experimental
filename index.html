<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kollektion</title>
  <link rel="icon" type="image/png" href="fav.png">
  <meta name="theme-color" content="#194026">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    @font-face {
      font-family: 'head';
      src: url('../fonts/head.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --green: #194026;
      --accent: #f1f1d7;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }                   

    html {
      background-color: #194026;
    }

    body {
      font-family: 'head', serif;
      background-color: #f1f1d7;
      color: var(--green);
      min-height: 100vh;
    }

    img {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    /* ================= HEADER ================= */

    header {
      background-color: var(--green);
      padding: 20px 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 15px;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    nav a {
      margin-left: 32px;
      text-decoration: none;
      font-size: 15px;
      color: var(--accent);
    }

    nav a:hover {
      color: #ffffff;
    }

    nav a.active {
      color: #ffffff;
    }

    .social-icon img {
      width: 17px;
      height: auto;
      display: block;
    }

    main {
      padding: 140px 32px 64px 32px;
    }

    /* ================= GRID ================= */

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .logo img {
        height: 14px;
      } 

      nav a {
        margin-left: 17px;
        font-size: 15px;
      }
    }

    @media (max-width: 335px) {
      .logo img {
        height: 12px;
      } 

      nav a {
        margin-left: 10px;
        font-size: 15px;
      }
    }

    /* ================= PRODUKTKARTE ================= */

    .product-card {
      text-decoration: none;
      color: var(--green);
      background-color: var(--white);
      padding: 20px;
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
    }

    .product-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #ffffff;
      display: block;
    }

    .product-card .title {
      margin-top: 14px;
      font-size: 15px;
    }

    /* ================= FOOTER ================= */

    footer {
      margin-top: 120px;
      padding: 80px 24px;
      text-align: center;
      font-size: 10px;
      color: var(--green);
      border-top: none;
    }
  </style>
</head>

<header>
  <nav>
    <div class="logo">
      <img src="logo.png" alt="Logo" draggable="false">
    </div>
    <div class="nav-right">
      <a href="index.html" class="active">Kollektion</a>
      <a href="galerie.html">Galerie</a>
      <a href="https://www.instagram.com/thomaundco/" target="_blank" class="social-icon">
        <img src="social.png" alt="Instagram" draggable="false">
      </a>
    </div>
  </nav>
</header> 

<main>
  <section class="grid">

    <a href="produkt-01.html" class="product-card">

      <div class="title">Schmuckschale Rund</div>
    </a>

    <a href="produkt-02.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 02" draggable="false">
      <div class="title">Schmuckschale Hummer</div>
    </a>

    <a href="produkt-03.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 03" draggable="false">

    </a>

    <a href="produkt-04.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 04" draggable="false">
      <div class="title">Windlicht Eckig</div>
    </a>

    <a href="produkt-05.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 05" draggable="false">
      <div class="title">Windlicht kurz</div>
    </a>

    <a href="produkt-06.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 06" draggable="false">
      <div class="title">Tablett, Einzelstück</div>
    </a>

    <a href="produkt-07.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 07" draggable="false">
      <div class="title">Matcha-Schale</div>
    </a>

    <a href="produkt-08.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 08" draggable="false">
      <div class="title">Becher, Bad</div>
    </a>

    <a href="produkt-09.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 09" draggable="false">
      <div class="title">Zahnbürstenablage</div>
    </a>

    <a href="produkt-10.html" class="product-card">
      <img src="images/pna.jpg" alt="Produkt 10" draggable="false">

    </a>

  </section>
</main>

<footer>
  Copyright © 2026 Mouleina. Alle Rechte vorbehalten.
</footer>
</body>
</html>
